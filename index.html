            display: flex;
            justify-content: center;
            gap: 20px; /* فاصله زیبا بین دو آیتم */

        .modal {
            display: none;
            position: fixed;
            z-index: 10000; /* افزایش z-index برای فول‌اسکرین */
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.95); /* تاریک‌تر برای تمرکز */
            padding: 0; /* حذف padding */
        }

        .modal-content {
            margin: auto;
            display: block;
            width: 95%; /* فول‌تر */
            max-width: 95vw; /* فول ویو */
            height: 95%; /* فول ارتفاع */
            max-height: 95vh;
            object-fit: contain; /* حفظ نسبت */
            transition: transform 0.3s ease; /* انیمیشن زوم */
            transform-origin: center center; /* مرکز زوم */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1); /* مرکزیت */
            cursor: grab; /* cursor برای drag */
        }

        .modal-content:active {
            cursor: grabbing;
        }

        /* استایل برای زوم در modal */
        .modal-content.zoomed {
            transform: translate(-50%, -50%) scale(1.5); /* زوم پیش‌فرض */
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            z-index: 10001;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }

        /* کپشن زیر تصاویر و ویدیوها */
        .caption {
            font-size: 14px;
            margin-top: 5px;
            color: #555;
            text-align: center;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            min-width: 250px;
            padding: 12px 16px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            z-index: 1001;
            transform: translateX(300px);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.loading {
            background-color: #FFC107;
        }

        .toast.success {
            background-color: #4CAF50;
        }

        .toast.error {
            background-color: #f44336;

        /* استایل برای بخش‌های اضافی پرداخت */
        .payment-section {
            margin-top: 15px;

        #cardDetails p {
            font-size: 16px;
            margin: 5px 0;
        }

        /* استایل برای بخش‌های اضافی */
        #cardCopySection {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #f9f9f9;
        }
    </style>

<body>
    <!-- Language switcher with flag and text -->
    <button class="lang-switcher" onclick="toggleLanguage()">
        <img id="flag-ir" src="https://flagcdn.com/ir.svg" alt="Iran Flag / پرچم ایران" style="display: none;">

        <span id="lang-text">فارسی</span>
    </button>

    <header>
        <video id="bgVideo" autoplay loop muted playsinline>
            <source src="/bg-video.mp4" type="video/mp4">
        </video>
        <h1 data-fa="فروش محصولات SuperTrend برای MT5" data-en="Selling SuperTrend Products for MT5">فروش محصولات SuperTrend برای MT5</h1>

        <form id="paymentForm" action="#">
            <select id="productSelect" onchange="updateAmounts()" data-fa="انتخاب محصول" data-en="Select Product"></select>
            <input type="text" id="amountTeter" readonly data-fa="مبلغ به تتر" data-en="Amount in Tether">مبلغ به تتر</input>
            <input type="text" id="amountRial" readonly data-fa="معادل ریالی" data-en="Equivalent in IRR">معادل ریالی</input>

            <div class="payment-method">
                <label>
                    <input type="radio" name="paymentMethod" value="trx" checked onclick="togglePaymentDetails()">
                    <img src="https://cryptologos.cc/logos/tron-trx-logo.png" alt="TRX">
                    <span data-fa="پرداخت با TRX" data-en="Pay with TRX">پرداخت با TRX</span>
                </label>
                <label>
                    <input type="radio" name="paymentMethod" value="card" onclick="togglePaymentDetails()">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.png" alt="Card">

            </div>

            <div id="cardCopySection" class="payment-section">
                <div id="copyCardText" onclick="copyCardToClipboard()" data-fa="شماره کارت: " data-en="Card Number: ">شماره کارت: </div>
            </div>

            <div id="cardDetails" class="payment-section">
                <p data-fa="نام بانک: " data-en="Bank Name: ">نام بانک: </p>
                <p data-fa="نام صاحب کارت: " data-en="Card Owner: ">نام صاحب کارت: </p>
            </div>

            <input type="text" name="txHashTrx" placeholder="TxHash (TRX)" data-fa="TxHash (TRX)" data-en="TxHash (TRX)">
            <input type="text" name="txHashCard" placeholder="TxHash (Card)" data-fa="TxHash (Card)" data-en="TxHash (Card)">
            <input type="text" name="account" placeholder="Account Number" data-fa="شماره حساب" data-en="Account Number" required>
            <input type="email" name="email" placeholder="Email" data-fa="ایمیل" data-en="Email" required>
            <button type="submit" data-fa="ارسال" data-en="Submit">ارسال</button>
        </form>

        <div id="result"></div>

        <div class="images-container">
            <div class="preview">
                <img class="image-preview" src="/image1.png" onclick="openFullScreenModal(this.src)">
                <p class="caption" data-fa="تصویر 1" data-en="Image 1">تصویر 1</p>
            </div>
            <!-- add more images as needed -->
        </div>

        <div class="videos-container">
            <div class="preview">
                <video class="video-preview" src="/video1.mp4" onclick="openVideoModal(this.src)">
                <p class="caption" data-fa="ویدیو 1" data-en="Video 1">ویدیو 1</p>
            </div>
            <!-- add more videos as needed -->
        </div>

        <footer>
            <div class="footer-container">
                <p>
                    <a href="https://telegram.me/supertrend_channel" data-fa="کانال تلگرام" data-en="Telegram Channel">کانال تلگرام</a>
                    <span class="separator">|</span>
                    <a href="https://instagram.com/supertrend_insta" data-fa="اینستاگرام" data-en="Instagram">اینستاگرام</a>
                    <span class="separator">|</span>
                    <a href="/contact" data-fa="تماس با ما" data-en="Contact Us">تماس با ما</a>
                </p>
            </div>
        </footer>
    </div>

    <!-- Modal for full-screen view -->
    <div id="myModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="imgModal">
        <video class="modal-content" id="videoModal" controls></video>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentLang = 'fa';
        let WORKER_URL = 'https://supertrend-worker-fa.click4tell.workers.dev';
        let products = {};
        let cardDetails = {};

        async function fetchProductsAndCard() {
            try {
                const response = await fetch(`${WORKER_URL}/products?lang=${currentLang}`);
                products = await response.json();
                console.log('Fetched products with dynamic rial:', products); // Debug log added
                populateProducts();
                populateProductSelect();

                const cardResponse = await fetch(`${WORKER_URL}/card-details?lang=${currentLang}`);
                cardDetails = await cardResponse.json();
                updateCardDisplay();
            } catch (error) {
                console.error('Error fetching data:', error);
                // fallback hardcoded products if needed
                products = {}; // Add your hardcoded fallback here if any
                populateProducts();
                populateProductSelect();
                updateCardDisplay();
            }
        }

        function populateProducts() {
            const container = document.getElementById('productContainer');
            container.innerHTML = '';
            Object.keys(products).forEach(key => {
                const prod = products[key];
                const div = document.createElement('div');
                div.className = 'product';
                div.innerHTML = `
                    <h3 data-fa="${prod.name_fa}" data-en="${prod.name_en}">${currentLang === 'fa' ? prod.name_fa : prod.name_en}</h3>
                    <p data-fa="${prod.desc_fa}" data-en="${prod.desc_en}">${currentLang === 'fa' ? prod.desc_fa : prod.desc_en}</p>
                    <p data-fa="قیمت: ${prod.trx} TRX | معادل ${prod.rial.toLocaleString()} ریال" data-en="Price: ${prod.trx} TRX | Equivalent ${prod.rial.toLocaleString()} IRR">${currentLang === 'fa' ? `قیمت: ${prod.trx} TRX | معادل ${prod.rial.toLocaleString()} ریال` : `Price: ${prod.trx} TRX | Equivalent ${prod.rial.toLocaleString()} IRR`}</p>
                `;
                container.appendChild(div);
            });
        }

        function populateProductSelect() {
            const select = document.getElementById('productSelect');
            select.innerHTML = '';
            Object.keys(products).forEach(key => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = currentLang === 'fa' ? products[key].name_fa : products[key].name_en;
                select.appendChild(option);
            });
            updateAmounts();
        }

        function updateAmounts() {
            const select = document.getElementById('productSelect');
            const selected = select.value;
            document.getElementById('amountTeter').value = products[selected].trx;
            document.getElementById('amountRial').value = products[selected].rial.toLocaleString();
        }

        function updateCardDisplay() {
            document.getElementById('copyCardText').textContent = cardDetails.number;
        }

        function togglePaymentDetails() {
            const method = document.querySelector('input[name="paymentMethod"]:checked').value;
            document.getElementById('trxDetails').style.display = method === 'trx' ? 'block' : 'none';
            document.getElementById('cardCopySection').style.display = method === 'card' ? 'block' : 'none';
            document.getElementById('cardDetails').style.display = method === 'card' ? 'block' : 'none';
        }

        function showPaymentForm() {
            document.getElementById('paymentForm').style.display = 'block';
            togglePaymentDetails();
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(document.getElementById('copyText').textContent).then(() => showToast(currentLang === 'fa' ? 'آدرس کپی شد!' : 'Address copied!', 'success'));
        }

        function copyCardToClipboard() {
            navigator.clipboard.writeText(document.getElementById('copyCardText').textContent).then(() => showToast(currentLang === 'fa' ? 'شماره کارت کپی شد!' : 'Card number copied!', 'success'));
        }

        function updateLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
            document.body.style.direction = lang === 'fa' ? 'rtl' : 'ltr';
            document.body.style.textAlign = lang === 'fa' ? 'right' : 'left';
            WORKER_URL = lang === 'fa' ? 'https://supertrend-worker-fa.click4tell.workers.dev' : 'https://supertrend-worker-en.click4tell.workers.dev';
            document.querySelectorAll('[data-fa]').forEach(el => el.textContent = el.getAttribute(`data-${lang}`));

        // تابع جدید برای باز کردن فول‌اسکرین برای تصاویر خاص
        function openFullScreenModal(src) {

        // تابع برای ورود به فول‌اسکرین
        function enterFullScreen(element) {

                element.mozRequestFullScreen();
            } else if (element.webkitRequestFullscreen) { // Chrome, Safari, Opera
                element.webkitRequestFullscreen();
            } else if (element.msRequestFullscreen) { // IE/Edge
                element.msRequestFullscreen();
            }
        }

        // تابع برای خروج از فول‌اسکرین
        function exitFullScreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.mozCancelFullScreen) {
                document.mozCancelFullScreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }

        function openVideoModal(src) {
            var modal = document.getElementById("myModal");

            modal.style.display = "block";
            modalVideo.src = src;
            modalVideo.style.display = "block";
            modalImg.style.display = "none";
            modalVideo.play();
            currentContent = modalVideo;
            initZoom(modalVideo); // **تغییر: init با زوم 2x**
            attachEventListeners(modalVideo);
            document.body.style.overflow = 'hidden';
        }

        function initZoom(element) {

            translateX = 0;
            translateY = 0;
            updateTransform(element);
        }

        function attachEventListeners(element) {

            const handleWheel = (e) => {

                zoomLevel *= delta;

            element.addEventListener('wheel', handleWheel, { passive: false });

            // **تغییر: کلیک تک برای زوم بیشتر (cycle: 2 -> 4 -> 1)**
            const handleClick = (e) => {
                e.stopPropagation(); // جلوگیری از بسته شدن مودال
                if (zoomLevel <= 1) zoomLevel = 2; // خودم یک کردم دو بود
                else if (zoomLevel < 2) zoomLevel = 2;// خودم تغییر دادمکه زیاد بزرگ نشود
                else zoomLevel = 1;

            const handleMouseDown = (e) => {

            const handleMouseMove = (e) => {

            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);

            element._listeners = { wheel: handleWheel, click: handleClick, mousedown: handleMouseDown, mousemove: handleMouseMove, mouseup: handleMouseUp };
        }

        function updateTransform(element) {
            element.style.transform = `translate(-50%, -50%) scale(${zoomLevel}) translate(${translateX}px, ${translateY}px)`;
        }

        // تابع بستن modal
        function closeModal() {
            var modal = document.getElementById("myModal");
            var modalVideo = document.getElementById("videoModal");
            modal.style.display = "none";
            modalVideo.pause();
            modalVideo.currentTime = 0;
            document.body.style.overflow = 'auto';
            exitFullScreen(); // خروج از فول‌اسکرین هنگام بستن
            if (currentContent && currentContent._listeners) {
                currentContent.removeEventListener('wheel', currentContent._listeners.wheel);
                currentContent.removeEventListener('click', currentContent._listeners.click);
                document.removeEventListener('mousemove', currentContent._listeners.mousemove);
                document.removeEventListener('mouseup', currentContent._listeners.mouseup);
                currentContent.removeEventListener('mousedown', currentContent._listeners.mousedown);

            }

        }

        window.onclick = function(event) {

            if (event.target == modal) {
                closeModal();

        document.addEventListener('keydown', function(e) {

        // Toast function
        function showToast(message, type) {

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
